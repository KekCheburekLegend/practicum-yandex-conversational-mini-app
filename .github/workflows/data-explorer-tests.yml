name: Data Explorer tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: explorer_test
          POSTGRES_PASSWORD: explorer_test
          POSTGRES_DB: explorer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U explorer_test -d explorer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      EXPLORER_TEST_POSTGRES_DSN: postgresql://explorer_test:explorer_test@127.0.0.1:5432/explorer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit and integration tests
        run: python -m pytest -q
